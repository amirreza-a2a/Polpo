# ==============================================================================
# Linux Continuous Integration (Tier-1 Reference Environment)
#
# Note: Ubuntu 24.04 is the project's Tier-1/reference POSIX Linux environment.
# This workflow does not represent continuous automated testing across every
# Linux distribution.
# ==============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run quality gates (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/run_quality_gates.py \
            --mode=commit-range \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}

      - name: Run quality gates (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          python scripts/run_quality_gates.py \
            --mode=commit-range \
            --base ${{ github.event.before }} \
            --head ${{ github.event.after }}

      - name: Run quality gates (push zero-SHA fallback)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: |
          python scripts/run_quality_gates.py \
            --mode=commit-range \
            --base ${{ github.event.after }}~1 \
            --head ${{ github.event.after }}

  test-linux:
    name: test-linux
    runs-on: ubuntu-24.04
    needs: quality-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q

  # Validates the Windows OS family, Win32 API contracts, and NTFS filesystem semantics
  # on a Windows Server runner. This is not consumer Windows 10/11 desktop shell or
  # hardware verification.
  test-windows:
    name: test-windows
    runs-on: windows-2025
    needs: quality-gates
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          pytest -q
