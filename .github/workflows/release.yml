# ==============================================================================
# End-to-End Release Pipeline (TICK-REL-07)
#
# Dedicated, atomic release workflow triggered by v* release tags or manual
# dry-run workflow_dispatch.
#
# Release Architecture:
#   Job 1: validate-release-ref (ubuntu-24.04)
#          - Tag format & core/version.py match
#          - Commit ancestry verification (must be on origin/main)
#          - Gitleaks secret scan
#          - run_quality_gates.py working-tree verification
#   Job 2: tier2-validation-matrix (macos-15, ubuntu-24.04 py3.10/py3.11)
#          - Cross-platform test suite & MathJax daemon validation
#   Job 3: package-and-smoke-test (ubuntu-24.04, windows-2025)
#          - Build PyInstaller standalone bundle
#          - Unpack in isolated temp directory outside repo
#          - Strip PATH to system binaries and run Polpo --self-test
#          - Generate deterministic archives & .sha256 sidecars
#   Job 4: publish-release (ubuntu-24.04)
#          - Only runs on v* tag pushes when all prior jobs pass
#          - Combines & verifies SHA256SUMS.txt
#          - Generates cryptographic build provenance attestation
#          - Publishes atomic GitHub release with release notes
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-validation/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or branch to validate and package (dry-run; will not publish release)'
        required: false
        default: 'main'
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release-ref:
    name: validate-release-ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.23.2'

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Verify release tag format, version match, and main branch ancestry
        env:
          TARGET_REF: ${{ inputs.ref || github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CORE_VER=$(python -c "import core.version; print(core.version.__version__)")
          echo "Detected core.version.__version__: ${CORE_VER}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${REF_NAME#v}"
            echo "Validating release tag: ${REF_NAME} (parsed version: ${TAG_VER})"

            if [[ "${TAG_VER}" != "${CORE_VER}" && "${TAG_VER}" != "${CORE_VER}-"* ]]; then
              echo "::error::Tag '${REF_NAME}' does not match core.version '${CORE_VER}'"
              exit 1
            fi

            # Ensure tagged commit is on or ancestor of origin/main
            git fetch origin main --depth=1000
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit ${COMMIT_SHA} is not an ancestor of origin/main"
              exit 1
            fi
            echo "Release tag ${REF_NAME} correctly matches version ${CORE_VER} and descends from origin/main"
          else
            echo "Validation run on ref '${TARGET_REF}' (not a release tag) — skipping tag-specific ancestry gating"
          fi

      - name: Install Linux GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies for quality gates
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Provision runtimes and MathJax dependencies
        run: |
          python scripts/fetch_runtimes.py --install-mathjax-deps

      - name: Run quality gates
        run: |
          python scripts/run_quality_gates.py --mode=working-tree

  tier2-validation-matrix:
    name: tier2-validation (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: validate-release-ref
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python-version: '3.12'
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.11'
    env:
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: software

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.23.2'

      - name: Install Linux GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Cache runtime binaries and MathJax dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            resources/bin
            resources/mathjax/node
            resources/mathjax/node.exe
            resources/mathjax/node_modules
          key: runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/runtimes.json', 'resources/mathjax/package-lock.json') }}

      - name: Provision pinned runtimes and MathJax dependencies
        run: |
          python scripts/fetch_runtimes.py --install-mathjax-deps

      - name: Verify MathJax worker standalone
        run: |
          python scripts/verify_mathjax_worker.py

      - name: Run test suite
        run: |
          pytest -q

  package-and-smoke-test:
    name: package-and-smoke-test (${{ matrix.platform_id }})
    runs-on: ${{ matrix.os }}
    needs: validate-release-ref
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_id: linux-x86_64
            artifact_name: polpo-dist-linux-x86_64
          - os: windows-2025
            platform_id: windows-x64
            artifact_name: polpo-dist-windows-x64
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.23.2'

      - name: Install Linux system GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-desktop.txt
          python -m pip install "pyinstaller==6.22.3"

      - name: Cache runtime binaries and MathJax dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            resources/bin
            resources/mathjax/node
            resources/mathjax/node.exe
            resources/mathjax/node_modules
          key: runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/runtimes.json', 'resources/mathjax/package-lock.json') }}

      - name: Provision pinned runtimes and MathJax dependencies
        run: |
          python scripts/fetch_runtimes.py --install-mathjax-deps

      - name: Verify MathJax worker standalone
        run: |
          python scripts/verify_mathjax_worker.py

      - name: Build standalone desktop package
        run: |
          python scripts/build_package.py --create-alias

      - name: Smoke test packaged Linux binary outside repository
        if: runner.os == 'Linux'
        env:
          BASE_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d "${BASE_TEMP:-/tmp}/polpo_smoke_XXXXXX")
          echo "Created isolated Linux smoke directory: ${SMOKE_DIR}"
          trap 'rm -rf "${SMOKE_DIR}"' EXIT

          ARCHIVE_PATH=$(ls dist/Polpo-*-linux-x86_64.tar.gz | head -n 1)
          if [ -z "${ARCHIVE_PATH}" ] || [ ! -f "${ARCHIVE_PATH}" ]; then
            echo "::error::Linux distribution archive not found in dist/"
            exit 1
          fi
          echo "Unpacking ${ARCHIVE_PATH} to ${SMOKE_DIR}..."
          tar -xzf "${ARCHIVE_PATH}" -C "${SMOKE_DIR}"

          # Configure isolated user profile & data paths
          export XDG_DATA_HOME="${SMOKE_DIR}/user_data"
          export XDG_CONFIG_HOME="${SMOKE_DIR}/user_config"
          export XDG_CACHE_HOME="${SMOKE_DIR}/user_cache"
          mkdir -p "${XDG_DATA_HOME}" "${XDG_CONFIG_HOME}" "${XDG_CACHE_HOME}"

          # Run frozen application self-test with constrained PATH (no system pandoc or node)
          echo "Executing ${SMOKE_DIR}/Polpo/Polpo --self-test..."
          PATH="/usr/bin:/bin" QT_QPA_PLATFORM=offscreen "${SMOKE_DIR}/Polpo/Polpo" --self-test
          echo "Linux frozen binary smoke test passed successfully."

      - name: Smoke test packaged Windows binary outside repository
        if: runner.os == 'Windows'
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        shell: pwsh
        run: |
          $smokeId = [System.Guid]::NewGuid().ToString("N")
          $baseTemp = if ($env:RUNNER_TEMP_DIR) { $env:RUNNER_TEMP_DIR } else { [System.IO.Path]::GetTempPath() }
          $smokeDir = Join-Path $baseTemp "polpo_smoke_$smokeId"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Write-Host "Created isolated Windows smoke directory: $smokeDir"

          $origPath = $env:PATH
          $origAppData = $env:APPDATA
          $origLocalAppData = $env:LOCALAPPDATA

          try {
            $zipFile = Get-ChildItem -Path "dist/Polpo-*-windows-x64.zip" | Select-Object -First 1
            if (-not $zipFile) {
              throw "Distribution zip not found in dist/"
            }
            Write-Host "Unpacking $($zipFile.FullName) to $smokeDir"
            Expand-Archive -Path $zipFile.FullName -DestinationPath $smokeDir -Force

            $exePath = Join-Path $smokeDir "Polpo\Polpo.exe"
            if (-not (Test-Path $exePath)) {
              throw "Packaged executable not found at $exePath"
            }

            # Configure isolated environment for smoke test
            $env:PATH = "C:\Windows\System32;C:\Windows"
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:APPDATA = Join-Path $smokeDir "AppData\Roaming"
            $env:LOCALAPPDATA = Join-Path $smokeDir "AppData\Local"
            New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null

            $stdoutLog = Join-Path $smokeDir "selftest_out.log"
            $stderrLog = Join-Path $smokeDir "selftest_err.log"

            Write-Host "Executing $exePath --self-test..."
            $proc = Start-Process -FilePath $exePath -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            }
            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            }

            Write-Host "Process exited with code $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) {
              throw "Windows frozen binary smoke test failed with exit code $($proc.ExitCode)"
            }
          } finally {
            $env:PATH = $origPath
            $env:APPDATA = $origAppData
            $env:LOCALAPPDATA = $origLocalAppData
            if (Test-Path $smokeDir) {
              Remove-Item -Recurse -Force $smokeDir
            }
          }
          Write-Host "Windows frozen binary smoke test passed successfully."

      - name: Upload packaged distribution artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Polpo-*.tar.gz
            dist/Polpo-*.tar.gz.sha256
            dist/Polpo-*.zip
            dist/Polpo-*.zip.sha256
            dist/polpo-*.tar.gz
            dist/polpo-*.tar.gz.sha256
            dist/polpo-*.zip
            dist/polpo-*.zip.sha256
          if-no-files-found: error

  publish-release:
    name: publish-release
    runs-on: ubuntu-24.04
    needs:
      - tier2-validation-matrix
      - package-and-smoke-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all package artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Combine and verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          ls -la

          # Verify each individual .sha256 sidecar matches its archive
          for sha_file in *.sha256; do
            echo "Verifying ${sha_file}..."
            sha256sum -c "${sha_file}"
          done

          # Consolidate into authoritative SHA256SUMS.txt
          cat *.sha256 | sort -u > SHA256SUMS.txt
          echo "Consolidated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

          # Re-verify consolidated checksums
          sha256sum -c SHA256SUMS.txt

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt

      - name: Publish atomic GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.sha256
            release-artifacts/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
